# Projects. `featured = true` gets a big tile with a screenshot on /projects/ and
# a slot on the home page. Everything else lands in the compact list underneath.
# Order here is the order on the page. Add a table, run build.py, done.

[[project]]
slug     = "nixeljam"
name     = "nixeljam"
year     = "2025 - now"
tags     = ["nix", "hyprland", "stylix"]
repo     = "https://github.com/milotek/nixeljam"
featured = true
blurb    = "My NixOS config. One flake, every machine, one colour."
images   = [
  { src = "img/projects/nixeljam.webp", alt = "Hyprland desktop with a clock widget and two terminals over a mountain wallpaper." },
  { src = "img/projects/nixeljam-server.webp", alt = "A dark server dashboard listing services, uptime and system stats." },
]
body = """
Built on top of [anotherhadi/nixy](https://github.com/anotherhadi/nixy), with my own
theme layer, hosts and server modules bolted on.

The whole desktop is repainted from one base16 scheme in `themes/`. Change the accent
in one file and Hyprland, waybar, the terminal, neovim and the GTK apps all follow.
The pink you are looking at right now is `base0D` out of `themes/pixeljam.nix`.
"""

[[project]]
slug     = "lockyn"
name     = "Lockyn"
year     = "2024 - now"
tags     = ["react native", "typescript", "firebase"]
featured = true
blurb    = "A studying app for GCSE and sixth form students. Unreleased, source is private."
card     = "img/projects/lockyn-onboarding.webp"
images = [
  { src = "img/projects/lockyn-welcome.webp", alt = "Lockyn welcome screen with a pink and purple gradient orb." },
  { src = "img/projects/lockyn-onboarding.webp", alt = "Lockyn onboarding screen asking why you are here." },
  { src = "img/projects/lockyn-home.webp", alt = "Lockyn home screen with a large circular study timer." },
  { src = "img/projects/lockyn-summary.webp", alt = "Lockyn weekly summary screen with usage bars and highlights." },
]
body = """
Cross platform, one codebase: iOS, Android, web and desktop. React Native on the front,
Firebase on the back because the data is document-shaped and I did not want to run a
database at 17.

It started life as my A level NEA and got rewritten properly afterwards. The UI is the
part I care about most; every screen went through a few passes before it stopped
annoying me.
"""

