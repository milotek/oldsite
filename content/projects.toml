[[project]]
slug = "neosource"
title = "Neosource"
kind = "Game engine"
years = "2025 -"
status = "In progress"
stack = ["Unity 2022.3", "URP 14", "C#"]
featured = true
org = "Pixeljam Studios"
summary = "Fragsurf ported forward to Unity 2022.3 and URP 14, with the Linux editor actually working."
body = """
Fragsurf is the closest thing surf and bunnyhop have to an open engine, and it
was stuck on an old Unity with a render pipeline nobody ships anymore. We
brought it forward.

It loads BSP maps at runtime, so CS:S and CS:GO geometry drops straight in. The
point of the whole thing is that the modding path stays open, which is the part
Source got right and everyone since has quietly closed off.
"""

