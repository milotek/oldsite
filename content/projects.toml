name     = "MakersBNB"
year     = "2025"
tags     = ["flask", "postgres", "tdd"]
repo     = "https://github.com/milotek/makersbnb"
featured = true
blurb    = "An AirBnB clone built by six of us in a week, test-first the whole way."
images = [
  { src = "img/projects/makersbnb.webp", alt = "MakersBNB listings page showing property cards with prices per night." },
]
body = """
Flask and Basecoat UI, Postgres underneath, pytest and Playwright on top. Team of six.

The interesting part was not the app, it was six people agreeing on an architecture on
day one and it still holding on day five. List a space, request a booking, approve or
decline it.
"""

[[project]]
slug     = "habits"
name     = "habits"
year     = "2026"
tags     = ["kotlin", "kiosk"]
repo     = "https://github.com/milotek/habits"
link     = "https://habits.tek.rip"
linkname = "live"
featured = true
blurb    = "A habit tracker that renders as a GitHub contribution grid, for a screen on my wall."
body = """
Kotlin. It runs on a tablet stuck to a wall, so the entire interface is one grid and
nothing else. If a habit tracker needs a login screen it has already lost.

I have tried about six of these apps and given up on all of them, always for the same
reason: opening an app to tick a box is more effort than the box is worth. This one is
already on, already showing, and one tap wide. Green square or no green square.
"""

