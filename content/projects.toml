[[project]]
slug     = "autopet"
name     = "AutoPet feeder"
year     = "2024"
tags     = ["raspberry pi", "javascript", "cad"]
featured = true
blurb    = "An automatic pet feeder, designed and built to a client's spec. The client was my neighbours."
images = [
  { src = "img/projects/autopet-build.webp", alt = "Three photographs of the finished pet feeder: white 3D printed body with an oak lid." },
  { src = "img/projects/autopet-proto.webp", alt = "Design document page showing cardboard prototype iterations and client feedback." },
  { src = "img/projects/autopet-pi.webp", alt = "Design document page showing the Raspberry Pi, touchscreen and electronics used." },
]
body = """
Raspberry Pi, a servo, a touchscreen and USB-C in, so there is exactly one cable. Shell is
3D printed ABS with an oak finish, because a plastic box on someone's kitchen floor is
still a thing they have to look at every day.

Ran the whole thing properly: client spec, cardboard prototypes, feedback rounds, an
evaluation. The design document is the part I am actually proud of.
"""

[[project]]
