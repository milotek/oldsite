[[project]]
slug = "airaccel"
title = "AIRACCEL"
kind = "Game"
years = "2025 -"
status = "In progress"
org = "Pixeljam Studios"
stack = ["WebGL", "TypeScript"]
summary = "Bunnyhop and surf, in a browser tab, with no server list to fight through."
body = """
Surf and bhop have survived for twenty years on community goodwill and are still
almost impossible to find if you don't already know where to look. You have to
own a Source game, find a server, and then get through the part where the
movement makes no sense for the first hour.

AIRACCEL removes the first two problems and is trying to do something about the
third. It runs in the browser. Graybox, the level editor, is open source.
"""

