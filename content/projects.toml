[[project]]
slug = "lockyn"
title = "Lockyn"
kind = "Mobile app"
years = "2024 -"
status = "Unreleased"
stack = ["React Native", "TypeScript", "Firebase"]
featured = true
summary = "A studying app for GCSE and sixth form students. Screen time, session timers, a daily summary."
body = """
Lockyn started as my A level NEA and turned into something I actually wanted to
ship. It locks you out of the apps that eat your afternoon, times your study
sessions, and gives you one honest screen before bed.

The frontend is React Native so it runs on iOS and Android off one codebase.
Firebase does auth and storage.

It isn't out yet. Exam board rules meant I couldn't release it until after
results day, and since then I've been rewriting most of the UI.
"""

