[[project]]
name = "Lockyn"
kicker = "mobile app · unreleased · 2024 to now"
blurb = """
A study and productivity app for GCSE and sixth-form students: focus timer, daily goals, screen-time summaries, study groups.
React Native and TypeScript on the front, Firebase behind it, one codebase for iOS, Android and web.
Started life as my A level Computer Science NEA, which is why it sat gated behind results day. Release date is "when it's good".
"""
tags = ["typescript", "react native", "firebase"]
size = "feature"
