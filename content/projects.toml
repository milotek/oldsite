title = "AutoPet Feeder"
kind = "Hardware"
years = "2023 - 2024"
status = "Delivered"
stack = ["Raspberry Pi", "JavaScript", "CAD", "3D printing"]
featured = true
summary = "An automated pet feeder built to a real client's spec. My neighbours wanted one, so they got one."
body = """
A Raspberry Pi, a servo, a touchscreen and a hopper, wrapped in a 3D printed
ABS shell with an oak top so it doesn't look like a science project in someone's
kitchen. USB-C in, no batteries to forget about.

I did this one properly: client spec, cardboard mockups, three iterations, then
a written evaluation at the end. The cardboard stage is the bit that saved me,
because model one was the wrong shape and I found that out for the price of a
box.
"""

