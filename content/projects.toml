[[project]]
name = "Neosource"
kicker = "unity · pixeljam studios · 2026"
blurb = """
Fragsurf ported to Unity 2022 with Linux editor support: a modernised Source engine for surf and bhop.
I fixed the Linux build, then landed CS:GO-style recoil and spread, view models and weapon sounds, and bullet penetration.
A bullet carries a depth budget in metres of concrete and spends it on every wall it crosses, so one number decides both whether a wall can be beaten and whether the shot was worth taking.
"""
tags = ["c#", "unity", "source engine"]
size = "feature"
images = [
  { src = "assets/img/projects/neosource.webp", alt = "Combat surf in Neosource, a player mid-air over a grey blocky map", caption = "combat surf" },
]
