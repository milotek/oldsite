[[project]]
slug     = "nixeljam"
title    = "nixeljam"
year     = "2026"
kind     = "config"
status   = "in use daily"
tags     = ["nix", "nixos", "hyprland", "dotfiles"]
blurb    = "My NixOS config. Four machines, one flake, one theme file that everything reads from."
featured = true
body = """
Started as a fork of [nixy](https://github.com/anotherhadi/nixy) and has drifted a long way since.

It runs my desktop, a mini PC that serves files, a VPS, and my work Mac, off one modular flake. Hyprland, Waybar, tofi, swaync, Ghostty, Neovim through nvf, all declared.

The bit I actually care about is `themes/pixeljam.nix`. One attrset holds the colour scheme, the rounding, the gaps, the border widths and the fonts. Change the accent in that file and GTK, the bar, the terminal, Neovim and the lock screen all move together on the next rebuild.
"""
shots = [
  { src = "nixeljam-1", alt = "Hyprland desktop with a floating Waybar and a pink accent" },
  { src = "nixeljam-2", alt = "Neovim and Spotify side by side in the same theme" },
  { src = "nixeljam-3", alt = "Browser and file manager, tiled" },
  { src = "nixeljam-dash", alt = "Server dashboard for the mini PC" },
]
[[project.links]]
label = "Repo"
href  = "https://github.com/milotek/nixeljam"

