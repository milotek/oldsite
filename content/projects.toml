The Legacy Console lighting had a particular soft, slightly wrong look, and
nothing on the modern shader scene reproduces it because everyone is chasing
path tracing instead.

Written against 1.6.4 with ShadersModCore, which is the version I actually play.
Works fine on OptiFine and Iris too.
"""

