[[project]]
slug   = "tittyos"
title  = "tittyos"
year   = "2025"
kind   = "library"
status = "wip"
tags   = ["c++", "machine-learning", "autograd"]
blurb  = "A deep learning library in C++. Tensors, shapes, dtypes and a working backward pass."
body = """
Built with [Samuel Johnson](https://github.com/SJ1727). Tensors carry a shape and a dtype, ops build a graph, `.backward()` fills in the gradients.

```cpp
ty::Tensor result = ty::sum(ty::multiply(tensor1, tensor2));
result.backward();
tensor1.grad(); // [2.0, 3.0, 5.0, 7.0, 11.0]
```

Still under development, and the name is not up for discussion.
"""
shots = [ { src = "tittyos-1", alt = "tittyos logo" } ]
[[project.links]]
label = "Repo"
href  = "https://github.com/milotek/tittyos"

