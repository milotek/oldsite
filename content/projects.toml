[[project]]
slug = "nixeljam"
title = "nixeljam"
kind = "System config"
years = "2025 -"
status = "Live"
stack = ["Nix", "NixOS", "Hyprland", "Stylix"]
featured = true
summary = "One flake, three machines: a desktop, a home server and a VPS. Everything declared, nothing clicked."
body = """
My NixOS configuration. It started as a fork of nixy and has drifted a long way
since, mostly because I kept adding machines.

The rule I hold it to: if it can't be rebuilt from the flake, it doesn't get
installed. That covers the desktop, the box running the file server and music,
and the VPS that owns the public ingress. Colours come from one base16 scheme so
the terminal, the bar and the editor never argue with each other.
"""

[[project.links]]
label = "Repo"
url = "https://github.com/milotek/nixeljam"


