[[project]]
slug = "epq-game"
title = "EPQ platformer"
kind = "Game"
years = "2023 - 2024"
status = "Complete"
stack = ["Godot 3.5", "GDScript"]
summary = "An accessibility-focused platformer, built over six months of weekends for my Extended Project Qualification."
body = """
The brief I set myself was a platformer that stays playable if you can't hear
it, can't see colour differences, or can't hit a two-frame input window. That
constraint shaped the level design far more than I expected it to.

The protagonist doesn't speak, which is deliberate. Valve do the same thing and it works for the same reason: nothing the character says can
contradict what you'd have said.
"""

[[project.links]]
label = "Repo"
url = "https://github.com/milotek/GodotGame"
note = "old fork, may not open in current Godot"

