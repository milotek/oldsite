title = "nixeljam"
line = "projects"
period = "2026 - now"
status = "active"
summary = """
My whole computing setup as one flake. A desktop, a mini PC doing the serving and an aarch64 VPS
holding the public ingress, all declared in one repo and rebuildable from nothing.
"""
