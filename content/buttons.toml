# 88x31 buttons.
#
# [[mine]]   -> generated by tools/make-buttons.py into assets/img/buttons/.
#               Change the text or colours, re-run the script, done.
# [[wall]]   -> buttons other people made. Drop an 88x31 file in
#               assets/img/buttons/ and add a block. Empty slots render as
#               dashed placeholders so the wall never looks broken.

[[mine]]
file  = "milo-tek"
