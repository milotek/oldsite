# Drawings. Files live in assets/img/art/. Mostly Procreate on an iPad Pro with
# an Apple Pencil, rescued from the old carrd site.

[art]
intro = "Made over the years, mostly in Procreate on an iPad with an Apple Pencil. A few are twenty seconds of work and I've kept them in anyway."

