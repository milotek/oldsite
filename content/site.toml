# -------------------------------------------------------------- colophon

[colophon]
body = """
Static HTML from one Python script with no dependencies. Content is two TOML files and a folder of
Markdown, so adding a project never means touching markup.

Source Sans 3 and MesloLGS Nerd Font, subset down to about 100 KB. Catppuccin Mocha, accent `#ffbdbd`.
No JavaScript, no analytics, no cookies. GitHub Pages.

There's a [post about it](blog/the-new-site.html) if you care, and the
[source](https://github.com/milotek/wst19) if you really care.
"""

