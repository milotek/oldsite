[now]
# Seeded from what I've actually been pushing. Edit freely.
updated = "2026-09-04"
intro   = "What I'm actually spending time on, rather than what I'd like you to think I am."
items = [
  "Rewriting my NixOS config, **nixeljam**, for the fourth time. It runs four machines now, including the work Mac.",
  "**habits**, a Kotlin habit tracker that renders as a GitHub-style grid, for a screen bolted to my wall.",
  "Slowly poking at **worksite**, the hand-written thing at milotek.dev that has background music and I refuse to remove it.",
  "Neetcode and Leetcode grinding, dumped into **xeetcode-submissions** so I can't lie to myself about it.",
]

[uses]
intro = "The short version. All of it is declared in [nixeljam](https://github.com/milotek/nixeljam) if you want the long one."

[[uses.group]]
name = "machine"
items = [
  "NixOS on a desktop, a mini PC, a VPS and a work Mac",
  "Hyprland, Waybar, tofi",
  "Catppuccin Mocha everywhere, with #ffbdbd as the accent",
]

[[uses.group]]
name = "writing code"
items = [
  "Ghostty, with an unreasonable number of cursor shaders",
  "Neovim",
  "lazygit and direnv",
]

[[uses.group]]
name = "everything else"
items = [
  "Obsidian for notes",
  "Blender and Godot when a game idea gets out of hand",
  "copyparty on the mini PC, holding far too much",
  "Wallpaper is a Team Fortress 2 screenshot of Watchtower, and has been for years",
]

[colophon]
lines = [
  "Static HTML. No framework, no third-party requests, no analytics, no cookies.",
  "`build.py` reads TOML and Markdown out of `content/` and writes the whole site. Adding a project is six lines of TOML, adding a post is a `.md` file. One Python file, standard library only.",
  "Search runs off `index.json`, which is generated from the same data as the pages, so it can't drift.",
  "Catppuccin Mocha, accent `#ffbdbd`. Source Sans 3 and JetBrains Mono, self-hosted.",
  "The 88x31 buttons are drawn by `tools/make-buttons.py` from a TOML file, using a 5x8 bitmap font with anti-aliasing off.",
  "Hosted on GitHub Pages. The repo is the site.",
]

[buttons]
intro = "The 88x31 wall. Mine are on the left, nick them. The rest is a starter set, and there is very obviously room for more."
mine_note = "Take one. Hotlinking is fine, GitHub pays for the bandwidth."
