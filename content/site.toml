# Everything on the front page that isn't a project, a drawing or a post.
# Edit this file, run `python3 build.py`, commit. No HTML required.

[profile]
name = "Milo Tekchandani"
handle = "milo tek"
tagline = "software engineer"
role = "Software Engineer (Apprentice) @ Google"
location = "London, UK"
base_url = "https://furfag.lol/wst19/"
description = "Milo Tekchandani, software engineer at Google in London. Search, games, systems and a bit of drawing."
avatar = "assets/img/art/old_avatar.webp"
avatar_alt = "A line drawing of a small creature on a pink background, drawn by Milo"
intro = """
I'm a software engineer at Google in London, on the Search app for mobile. Backend and infrastructure,
mostly. So, google.com.

Away from that I build games with a couple of mates, run three machines off one Nix flake, and draw
things when I can be bothered. Everything below is stuff I actually built.
"""

[copy]
work_note = "The day job."
projects_note = "Things I built and finished, or am still finishing."
games_note = "Games, engines and the bits that go inside them."
art_note = "Drawn mostly in Procreate on an iPad Pro with an Apple Pencil. Click one for the full size."
writing_note = "Rare. Only when there's something worth writing down."
buttons_note = "88x31, the way God intended. Nick mine if you link me."

