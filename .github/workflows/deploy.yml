name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN is read-only for contents.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued run finishes rather than being cancelled, so a deploy is never
# abandoned half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The CV lives in the profile repo. Refreshing it here keeps that the
      # single place it is edited, while still serving it same-origin so the
      # inline viewer works. A network blip falls back to the committed copy
      # rather than failing the deploy.
      - name: Refresh CV from the profile repo
        run: |
          curl -sSfL --retry 3 -o public/CV.pdf \
            https://raw.githubusercontent.com/milotek/milotek/main/CV.pdf \
            || echo "could not refresh CV, using the committed copy"
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
