# Rebuilds the site when content changes, so editing a Markdown file on
# github.com is enough to publish. Output is committed because Pages serves
# flat files straight out of the repo.
name: build

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "static/**"
      - "img/**"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "rebuild"
          git push
