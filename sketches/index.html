<h1><small class="note stamp">18 pieces</small>Sketches</h1>
<p>Mostly Procreate on an iPad Pro with a Pencil, going back to sixth form.
Some of it is concept art for games, some of it is for mates, some of it is padding and I've said so in the caption.</p>
<div class="pins gallery"><figure class="taped square" style="--w:900px"><img src="../assets/img/art/moose_grey.webp" alt="A cartoon moose with big antlers and a red jumper, looking slightly alarmed" width="900" height="900" loading="lazy"><figcaption>Laser Antlers, final render. A character based on an old internet mate. He looks like that on purpose.</figcaption></figure><figure class="taped portrait" style="--w:999px"><img src="../assets/img/art/epq_antagonist_laser_antlers.webp" alt="A character design sheet titled Laser Antlers with notes and a polaroid of the moose" width="999" height="1400" loading="lazy"><figcaption>The design sheet for the same character.</figcaption></figure><figure class="taped portrait" style="--w:925px"><img src="../assets/img/art/epq_protagonist.webp" alt="A pale figure in a top hat and red tie on a dark background, labelled protagonist" width="925" height="1400" loading="lazy"><figcaption>Protagonist concept for my EPQ game.</figcaption></figure><figure class="taped landscape" style="--w:1400px"><img src="../assets/img/art/de_dust2_fullbright.webp" alt="A painted view down a sandy street with a bombsite in the distance" width="1400" height="978" loading="lazy"><figcaption>de_dust2 in mat_fullbright.</figcaption></figure><figure class="taped landscape" style="--w:1400px"><img src="../assets/img/art/bring_back_lake.webp" alt="Ink sketch of the house and dock on de_lake with the hashtag Bring Back Lake" width="1400" height="972" loading="lazy"><figcaption>#BringBackLake. My favourite map. See lakeback.</figcaption></figure><figure class="taped square" style="--w:400px"><img src="../assets/img/art/steam_pfp_commission.webp" alt="A cartoon character with messy black hair and a cigarette, drawn for a Steam profile" width="400" height="400" loading="lazy"><figcaption>A mate&#x27;s Steam profile picture, drawn by request.</figcaption></figure><figure class="taped landscape" style="--w:1400px"><img src="../assets/img/art/friends_birthday.webp" alt="A grid of small cartoon portraits of friends with their names written above each" width="1400" height="1067" loading="lazy"><figcaption>Me and my friends, drawn for someone&#x27;s birthday.</figcaption></figure><figure class="taped portrait" style="--w:977px"><img src="../assets/img/art/hardware_vs_software.webp" alt="A dark poster titled Hardware versus Software with handwritten notes and a laptop drawing" width="977" height="1400" loading="lazy"><figcaption>Poster for a Computer Science competition in first term. Hardware versus software.</figcaption></figure><figure class="taped landscape" style="--w:1400px"><img src="../assets/img/art/geometry_dash_10.webp" alt="Geometric shapes in a pink and orange gradient" width="1400" height="978" loading="lazy"><figcaption>Geometry Dash 10 year anniversary fan art. I don&#x27;t know what it represents either. Padding.</figcaption></figure><figure class="taped landscape" style="--w:1400px"><img src="../assets/img/art/pygame_title.webp" alt="Pixel art mountains under a full moon at dusk" width="1400" height="1050" loading="lazy"><figcaption>Title screen for a pygame project.</figcaption></figure><figure class="taped landscape" style="--w:1400px"><img src="../assets/img/art/pygame_sunset.webp" alt="Pixel art sunset over water" width="1400" height="1050" loading="lazy"><figcaption>Sunset stage, same pygame project.</figcaption></figure><figure class="taped landscape" style="--w:1400px"><img src="../assets/img/art/pygame_space.webp" alt="Pixel art of the Earth and a meteor in space" width="1400" height="1050" loading="lazy"><figcaption>Space stage.</figcaption></figure><figure class="taped landscape" style="--w:1400px"><img src="../assets/img/art/pygame_world.webp" alt="Pixel art blue sky with clouds over grass" width="1400" height="1050" loading="lazy"><figcaption>World stage.</figcaption></figure><figure class="taped landscape" style="--w:1400px"><img src="../assets/img/art/pygame_underground.webp" alt="Pixel art cave rocks with a skull" width="1400" height="1050" loading="lazy"><figcaption>Underground stage.</figcaption></figure><figure class="taped square" style="--w:1077px"><img src="../assets/img/art/giraffe_pixelmator.webp" alt="A flat cartoon giraffe in a field" width="1077" height="1076" loading="lazy"><figcaption>Cute giraffe, made in Pixelmator Pro to demonstrate the app.</figcaption></figure><figure class="taped landscape" style="--w:640px"><img src="../assets/img/art/one_minute_sketch.webp" alt="A scribbled sad stick figure next to a scribbled grinning face" width="640" height="480" loading="lazy"><figcaption>Under a minute, for a friend. Quality reflects that.</figcaption></figure><figure class="taped landscape" style="--w:640px"><img src="../assets/img/art/under_construction.webp" alt="A stick figure giving a thumbs up next to two cogs, captioned under construction, milo tek 2024" width="640" height="480" loading="lazy"><figcaption>The old site&#x27;s under construction gif. It sat in every screenshot slot for two years.</figcaption></figure><figure class="taped square" style="--w:1080px"><img src="../assets/img/art/old_pfp.webp" alt="A white stick figure on a pink gradient" width="1080" height="1080" loading="lazy"><figcaption>My old profile picture on most websites.</figcaption></figure></div>
