<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate" type="application/rss+xml" title="milotek.dev" href="/rss.xml" />
    <link rel="alternate" type="application/atom+xml" title="milotek.dev" href="/atom.xml" />
    <link rel="alternate" type="application/feed+json" title="milotek.dev" href="/feed.json" />
    <!--app-head-->
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // Kept inline and tiny for that reason; it must not wait for a bundle.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
